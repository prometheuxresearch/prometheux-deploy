version: '3.8'

services:
  vadalog-parallel:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/prometheux-reasoner-premises-n:latest
    pull_policy: always
    container_name: vadalog-parallel
    # Host mode means it binds to the host's network stack.
    network_mode: "host"
    # 'ports:' is ignored in host network mode,
    # so you can remove or comment it out
    # ports:
    #   - "8080:8080"
    volumes:
      - './prometheux/shared/disk:/vadalog-parallel/disk:rw'
      - './prometheux/vadalog-parallel/pmtx.properties:/vadalog-parallel/pmtx.properties:rw'
      - './prometheux/vadalog-parallel/spark-defaults.conf:/vadalog-parallel/spark-defaults.conf:rw'
    environment:
      - JAVA_OPTS=-Xmx4G
    restart: unless-stopped

  data-manager:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/data-manager:latest
    pull_policy: always
    container_name: data-manager
    # Host mode means it binds to the host's network stack.
    network_mode: "host"
    # 'ports:' is ignored in host network mode,
    # so you can remove or comment it out
    # ports:
    #   - "8085:8085"
    volumes:
      - './prometheux/shared/disk:/data-manager/disk:rw'
    restart: unless-stopped

  vadalingo:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/vadalingo:latest
    pull_policy: always
    container_name: vadalingo
    network_mode: "host"
    restart: unless-stopped
  
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pgvector
    network_mode: "host"
    restart: unless-stopped
    environment:
      POSTGRES_USER: prometheux
      POSTGRES_PASSWORD: postgres@prometheux
      POSTGRES_DB: prometheux
    volumes:
      - './prometheux/postgres-data:/var/lib/postgresql/data:rw'

  jupyterlab:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/jupyter-lab:latest
    pull_policy: always
    container_name: jupyterlab
    # Also use host networking
    network_mode: "host"
    # ports:
    #   - "8888:8888"
    volumes:
      - './prometheux/shared/disk:/notebooks:rw'
    environment:
      - VADALOG_HOST=localhost
      - VADALOG_PORT=8080
      - myToken= # leave empty for local installation
      - myUrl= # leave empty for local installation
    restart: unless-stopped

  jarvispy:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/jarvispy:latest
    pull_policy: always
    container_name: jarvispy
    # Host mode means it binds to the host's network stack.
    network_mode: "host"
    # 'ports:' is ignored in host network mode,
    # so you can remove or comment it out
    # ports:
    #   - "8000:8000"
    environment:
      - RUN_MODE=development
      - USER=devuser
      - ORGANIZATION=devorg
    restart: unless-stopped