version: '3.8'

services:
  vadalog-parallel:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/prometheux-reasoner-premises:latest
    container_name: vadalog-parallel
    ports:
      - "8080:8080"
    volumes:
      - './prometheux/shared/disk:/vadalog-parallel/disk:rw'
      - './prometheux/vadalog-parallel/pmtx.properties:/vadalog-parallel/pmtx.properties:rw'
      - './prometheux/vadalog-parallel/spark-defaults.conf:/vadalog-parallel/spark-defaults.conf:rw'
    environment:
      - JAVA_OPTS=-Xmx4G
    networks:
      - app-network
    restart: unless-stopped

  jupyterlab:
    image: 094284551733.dkr.ecr.eu-west-2.amazonaws.com/jupyter-lab:new
    container_name: jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - './prometheux/shared/disk:/notebooks:rw'
    environment:
      - VADALOG_HOST=vadalog-parallel
      - VADALOG_PORT=8080
      - myToken= # leave empty for local installation
      - myUrl= # leave empty for local installation
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
