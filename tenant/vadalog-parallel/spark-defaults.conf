appName prometheux
## [OPTIONS] local[*], local[Number_of_cores], 
## spark://HOST:PORT, yarn 
spark.master local[*]
spark.remoteURL sc://dbc-b3de7e58-xxx.cloud.databricks.com:443/;token=dapixxx;x-databricks-cluster-id=1229-xxxx-2jbcvz7y;
## max memory for driver
spark.driver.memory 4g
spark.driver.maxResultSize 4g
## max memory per executor
spark.executor.memory 4g
## [OPTIONS] cluster, client
spark.submit.deployMode client
## number of executor per instance of each worker
spark.executor.instances 1
## number of cores on each executor
spark.executor.cores 4
## allocates dynamically instances and cores
spark.dynamicAllocation.enabled false
## autotune the shuffle partition number
spark.sql.adaptive.enabled true
## enable coalesce partitions to reduce the number of partitions after shuffle
spark.sql.adaptive.coalescePartitions.enabled true
## the number of partitions to use when shuffling data for joins or aggregations
## if run in local[*] mode set this number as the number of your machine's core
## if run in yarn mode set this number as the number of machine * number of cores of each machine
spark.sql.shuffle.partitions 4
## yarn properties for distributed reasoning
## hadoop FS dir
spark.hadoop.defaultFS hdfs://localhost:9000
## Staging directory used for storing checkpoint
spark.yarn.stagingDir hdfs://localhost:9000/user/
## dir where jars for spark are
## spark.yarn.jars hdfs://localhost:9000/user/hadoop/jars/*
## hostname of resource manager
spark.hadoop.yarn.resourcemanager.hostname localhost
## Ip address and port of resource manager
spark.hadoop.yarn.resourcemanager.address localhost:8032
## Ip address and port of resource manager scheduler
spark.hadoop.yarn.resourcemanager.scheduler.address localhost:8030
## spark serializer
spark.serializer org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max 2047m
## jars to distribute that include lambda functions
## spark.jars thirdparty/distributed-add-on/distributed-aggregations-add-on-1.13.5.jar
## directory to use for scratch space
spark.local.dir tmp
## Whether to compress RDD checkpoints
spark.checkpoint.compress true
## Whether to compress before shuffling
spark.shuffle.compress true
## Set this property to -1 to use SortMergeJoin instead of Broadcast Hash Join
## spark.sql.autoBroadcastJoinThreshold -1
## aws configs
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.server-side-encryption-algorithm AES256
spark.hadoop.fs.s3a.endpoint https://s3.amazonaws.com
## SQL extensions, comma-separated:
##  - Apache Iceberg (MERGE/UPDATE/DELETE, snapshot procedures, branch & tag
##    DDL) — required when any `iceberg` bind is present.
##  - Delta Lake (MERGE/UPDATE/DELETE, time-travel & VACUUM/OPTIMIZE SQL) —
##    only needed for SQL-level Delta features; path-based `delta` binds work
##    with just the jar. Both are safe no-ops when unused.
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension
## Default local Hadoop-backed Iceberg catalog. NAMED catalog (`local_iceberg`),
## additive — does NOT replace spark_catalog, Unity Catalog, Hive metastore, or
## any other registered catalog. Vadalog `@bind` addresses tables in this
## catalog as `local_iceberg.<namespace>.<table>`.
spark.sql.catalog.local_iceberg org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local_iceberg.type hadoop
## Warehouse root for this catalog. Any key in this file can be overridden at
## runtime by an environment variable named `PMTX_SPARK_<key>` (env wins over
## this file). The multi-tenant control plane uses this to inject a PER-TENANT
## warehouse at pod-creation time WITHOUT editing this file, e.g.:
##   PMTX_SPARK_spark.sql.catalog.local_iceberg.warehouse=abfss://<org>@<acct>.dfs.core.windows.net/warehouse
## TEMP (ADLS RBAC experiment — do NOT commit): warehouse points at the shared
## ADLS Gen2 container. Revert to `iceberg-warehouse` before committing.
spark.sql.catalog.local_iceberg.warehouse abfss://warehouse@xxxxx.dfs.core.windows.net/
## Default new tables in this catalog to Iceberg table-format v3 (deletion
## vectors, richer types). The Iceberg runtime otherwise creates v2; this
## `table-default.<property>` applies to every table created through the
## catalog, so per-bind `format-version=...` options are only needed to
## override it. Individual binds can still pin a different version.
spark.sql.catalog.local_iceberg.table-default.format-version 3
## To add a production catalog (REST / Hive / Glue / Nessie), register an
## additional named catalog alongside `local_iceberg`. Example REST endpoint:
# spark.sql.catalog.prod_catalog org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.prod_catalog.type rest
# spark.sql.catalog.prod_catalog.uri https://iceberg-rest.example.com
## On Databricks, do NOT replace `spark_catalog` — Unity Catalog already owns
## it. Use a named catalog like `local_iceberg`/`prod_catalog` above instead.
## Delta Lake — make the default session catalog Delta-aware so managed
## `delta` catalog-table binds (`saveAsTable` / `read().table()`) create and
## resolve proper Delta tables. DeltaCatalog delegates non-Delta tables to the
## underlying session catalog, so csv/parquet/jdbc/iceberg are unaffected.
## Path-based `delta` binds (s3a://…, /path) need only the jar, not this.
## On Databricks this local default is overridden — Unity Catalog owns
## spark_catalog there.
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog
## metrics
# spark.metrics.conf src/main/resources/metrics.properties
# spark.hadoop.fs.s3a.statistics.instrumentation org.apache.hadoop.fs.s3a.statistics.impl.IOStatisticsStore
# spark.hadoop.fs.s3a.statistics.publisher.class org.apache.hadoop.fs.s3a.statistics.impl.IOStatisticsLoggingStore
# spark.hadoop.fs.s3a.statistics.io.enabled true
